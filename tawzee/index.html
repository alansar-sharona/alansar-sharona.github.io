<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>التوزيع — جمعية الأنصار</title>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--g:#14713A;--g2:#0E5A2D;--o:#E67E22;--bg:#F4F7F5;--tx:#1D2B22;--mut:#5E6E64;--red:#C0392B;--redbg:#FDECEA;--okbg:#E6F4EA;--warnbg:#FFF4E5}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:17px}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:18px;margin:0}
header small{opacity:.85;font-size:13px}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px}
h2{font-size:19px;margin:0 0 12px;color:var(--g)}
input,select{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid #CFD8D2;border-radius:12px;background:#fff;direction:ltr;text-align:center}
input:focus{outline:none;border-color:var(--g)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:19px;font-weight:700;color:#fff;background:var(--g);margin-top:12px;cursor:pointer}
.btn.o{background:var(--o)}.btn.ghost{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn:disabled{opacity:.5}
.act{display:flex;justify-content:space-between;align-items:center;padding:14px;border:2px solid #E2E8E4;border-radius:14px;margin-bottom:10px;cursor:pointer;background:#fff}
.act b{display:block;font-size:17px}.act span{font-size:13px;color:var(--mut)}
.act .n{font-size:22px;font-weight:700;color:var(--g);text-align:center;min-width:64px}
.act .n small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.pill{display:inline-block;background:var(--warnbg);color:#8A4B0B;border-radius:20px;padding:2px 10px;font-size:13px;margin-inline-start:6px}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:40px}
.row{display:flex;gap:8px}.row>*{flex:1}
.res{border-radius:16px;padding:16px;margin-bottom:14px;border:3px solid}
.res.ok{background:var(--okbg);border-color:var(--g)}
.res.no{background:var(--redbg);border-color:var(--red)}
.res .v{font-size:22px;font-weight:700;margin-bottom:8px}
.res.ok .v{color:var(--g)}.res.no .v{color:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:700}
.big{font-size:21px;font-weight:700}
.msg{text-align:center;color:var(--mut);font-size:14px;margin-top:8px}
.err{color:var(--red);font-weight:700;text-align:center;margin-top:10px}
.list div{display:flex;justify-content:space-between;border-bottom:1px solid #EEF2EF;padding:8px 2px;font-size:15px}
.hide{display:none!important}
.sec{font-size:14px;font-weight:700;color:var(--mut);margin:14px 2px 8px}.act.c{border-style:dashed}.act.d{background:#F7FAF8}
details summary{cursor:pointer;font-weight:700;color:var(--g);font-size:15px;margin:14px 2px 8px}
.st{display:inline-block;border-radius:20px;padding:1px 8px;font-size:12px;margin-inline-start:4px;background:#EEF2EF;color:var(--mut)}.st.ok{background:var(--okbg);color:var(--g)}
.f2{display:flex;gap:8px}.f2>*{flex:1}.lb{display:block;font-size:13px;color:var(--mut);margin:8px 2px 4px;text-align:right}
.spin{text-align:center;padding:20px;color:var(--mut)}
.toast{position:fixed;left:16px;right:16px;bottom:18px;max-width:488px;margin:auto;background:var(--g);color:#fff;border-radius:14px;padding:14px 16px;font-weight:700;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2)}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px"><a href="../app/" style="color:#fff;text-decoration:none;background:rgba(255,255,255,.15);border-radius:10px;padding:6px 10px;font-size:14px">🏠 المنصة</a><div><h1>التوزيع</h1><small id="who"></small></div></div>
  <button id="logout" class="hide" onclick="logout()">خروج</button>
</header>
<main>
  <!-- login -->
  <section id="s-login" class="card">
    <h2>دخول المسؤول عن التوزيع</h2>
    <input id="pin" type="password" inputmode="numeric" placeholder="الرقم السري" autocomplete="off">
    <button class="btn" onclick="doLogin()">دخول</button>
    <div id="loginErr" class="err"></div>
  </section>

  <!-- activities -->
  <section id="s-acts" class="hide">
    <div class="card"><h2>اختار العطاء اللي بتوزّعه</h2><div id="acts"><div class="spin">جاري التحميل…</div></div>
      <div class="msg">أي عطاء بيتعمل من «إدارة العطاءات» بيظهر هنا — تقدر تسجّل فيه المستفيدين حتى لو اتوزّع خلاص.</div></div>
  </section>

  <!-- scan -->
  <section id="s-scan" class="hide">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><b id="actName"></b><span id="actFreq" class="pill"></span></div>
        <button class="btn ghost" style="width:auto;margin:0;padding:6px 12px;font-size:14px" onclick="backToActs()">تغيير</button>
      </div>
      <div class="msg" id="actStats"></div>
      <div id="doneBox"></div>
    </div>
    <div id="result"></div>
    <div class="card" id="scanCard">
      <div id="reader"></div>
      <button class="btn o" id="camBtn" onclick="toggleCam()">📷 اسكان الباركود</button>
      <div class="msg">أو اكتب رقم الملف أو الرقم القومي:</div>
      <div class="row" style="margin-top:8px">
        <input id="q" inputmode="numeric" placeholder="رقم الملف / الرقم القومي" onkeydown="if(event.key==='Enter')search()">
      </div>
      <button class="btn" onclick="search()">بحث</button>
    </div>
    <div class="card"><h2 style="font-size:16px">آخر تسليمات النهارده</h2><div id="recent" class="list"></div></div>
  </section>
</main>
<div id="toast" class="toast hide"></div>

<script>
var PIN = '', ADMIN = false, ACT = null, cam = null, camOn = false, busy = false, current = null;
function $(id){return document.getElementById(id)}
function show(id){['s-login','s-acts','s-scan'].forEach(function(s){$(s).classList.toggle('hide',s!==id)})}
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var API='https://script.google.com/macros/s/AKfycbw4BoO-LLl3CN501okOdRfNuyMJgorbOII_vWyhRJtbsuKvr_4on3gBV_cjD8GcIGcZ3Q/exec';
function call(fn,args,ok,fail){
  fail=fail||alertErr;
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){return r.json()})
    .then(function(j){j.ok?ok(j.data):fail(j.error||'حصل خطأ')})
    .catch(function(){fail('مفيش اتصال بالنت — حاول تاني')});
}
function alertErr(m){toast(m,true)}
function toast(m,bad){var t=$('toast');t.textContent=m;t.style.background=bad?'var(--red)':'var(--g)';t.classList.remove('hide');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.add('hide')},3500)}
function beep(ok){try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;g.gain.value=.15;o.start();setTimeout(function(){o.stop();c.close()},ok?180:450)}catch(e){} try{navigator.vibrate&&navigator.vibrate(ok?80:[200,80,200])}catch(e){}}

/* login */
function doLogin(p){
  var pin=p||$('pin').value.trim(); $('loginErr').textContent='';
  call('login',[pin],function(u){PIN=pin;ADMIN=u.role==='مدير النظام'||u.role==='إدارة';store('ansar_pin',pin);$('who').textContent=u.name+' — '+u.role;$('logout').classList.remove('hide');loadActs()},
    function(m){store('ansar_pin',null);show('s-login');$('loginErr').textContent=m});
}
function logout(){stopCam();PIN='';store('ansar_pin',null);store('ansar_act',null);$('who').textContent='';$('logout').classList.add('hide');$('pin').value='';show('s-login')}

/* activities */
function nf(x){return Number(x||0).toLocaleString('en-US')}
function aSub(a){var agg=a.mode==='إجمالي',t=[];if(a.date)t.push(a.date);
  if(agg||a.done){if(a.aggN)t.push(nf(a.aggN)+' أسرة');if(a.aggQ)t.push(nf(a.aggQ)+' '+(a.unit||''));t.push('بالأسماء '+nf(a.total))}else t.push(a.freq+' — '+a.elig);
  return t.join(' · ')}
function loadActs(){
  show('s-acts');$('acts').innerHTML='<div class="spin">جاري التحميل…</div>';
  call('getActivities',[PIN,true],function(list){
    if(!list.length){$('acts').innerHTML='<div class="msg">مفيش عطاءات لسه — اعمل عطاء من «إدارة العطاءات» في المنصة.</div>';return}
    window._acts=list; var last=load('ansar_act');
    function row(a){var i=list.indexOf(a);return '<div class="act'+(a.done?' d':a.open?'':' c')+'" onclick="pickAct('+i+')"><div><b>'+esc(a.name)+
      (a.done?'<span class="st ok">✅ تم التوزيع</span>':a.open?'':'<span class="st">⏸ مقفول</span>')+'</b><span>'+esc(aSub(a))+'</span></div><div class="n">'+a.today+'<small>النهارده</small></div></div>'}
    var o=list.filter(function(a){return a.open&&!a.done}),c=list.filter(function(a){return !a.open&&!a.done}),d=list.filter(function(a){return a.done});
    $('acts').innerHTML=(o.length?'<div class="sec">🟢 شغالة دلوقتي</div>'+o.map(row).join(''):'')+
      (c.length?'<div class="sec">⏸ لسه ما اتعلّمتش «تم التوزيع»</div>'+c.map(row).join(''):'')+
      (d.length?'<details'+(o.length+c.length?'':' open')+'><summary>✅ تم توزيعها ('+d.length+') — لتسجيل الأسماء بعدين</summary>'+d.map(row).join('')+'</details>':'');
    var pre=new URLSearchParams(location.search).get('act');if(pre){var j=list.findIndex(function(a){return a.code===pre});history.replaceState(null,'',location.pathname);if(j>=0){pickAct(j);return}toast('العطاء ده مش موجود',true)}
    if(last){var k=list.findIndex(function(a){return a.code===last});if(k>=0&&o.length===1&&o[0]===list[k])pickAct(k)}
  });
}
function actStats(){var a=ACT;$('actStats').textContent='اتسجّل النهارده: '+a.today+' — بالأسماء: '+nf(a.total)+(Number(a.aggN)>a.total?' من '+nf(a.aggN)+' أسرة':'')+(a.date?' — تاريخ التوزيع: '+a.date:'');
  $('actFreq').textContent=a.done?'✅ تم التوزيع':a.mode==='إجمالي'?'إجمالي':a.freq;drawDone()}
function pickAct(i){ACT=window._acts[i];store('ansar_act',ACT.code);$('actName').textContent=ACT.name;
  actStats();$('result').innerHTML='';$('q').value='';show('s-scan');loadRecent()}
function drawDone(){var b=$('doneBox');if(!ADMIN){b.innerHTML='';return}
  b.innerHTML=ACT.done?'<button class="btn ghost" style="font-size:15px;padding:9px" onclick="doneForm()">✏️ تعديل أرقام التوزيع</button>':'<button class="btn" style="font-size:16px;padding:11px" onclick="doneForm()">✅ تم التوزيع — اقفل العطاء وسجّل الإجمالي</button>'}
function doneForm(){var a=ACT,n=Math.max(a.total||0,Number(a.aggN)||0),v=function(id,val){return '<input id="'+id+'" inputmode="decimal" value="'+esc(val==null?'':val)+'" style="font-size:18px;padding:9px">'};
  $('doneBox').innerHTML='<div style="border-top:1px solid #E2E8E4;margin-top:12px;padding-top:6px"><b style="color:var(--g)">✅ إنهاء العطاء — تم التوزيع</b>'+
   '<div class="f2"><div><label class="lb">عدد الأسر المستفيدة</label>'+v('dN',n||'')+'</div><div><label class="lb">الكمية الإجمالية'+(a.unit?' ('+esc(a.unit)+')':'')+'</label>'+v('dQ',a.aggQ)+'</div></div>'+
   '<div class="f2"><div><label class="lb">إجمالي القيمة (جنيه)</label>'+v('dV',a.aggV)+'</div><div><label class="lb">تاريخ التوزيع</label><input id="dD" type="date" value="'+esc(a.date||new Date().toISOString().slice(0,10))+'" style="font-size:16px;padding:9px"></div></div>'+
   '<div class="msg" style="text-align:right">الأسماء تقدر تكمّل تسجيلها هنا بعد كده عادي، وهتتسجل بتاريخ التوزيع.</div>'+
   '<div class="f2"><button class="btn ghost" onclick="drawDone()">إلغاء</button><button class="btn" id="dGo" onclick="doneSave()">💾 حفظ</button></div></div>'}
function dNum(x){return String(x||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[,،٬\s]/g,'').trim()}
function doneSave(){var p={code:ACT.code,done:true,aggN:dNum($('dN').value),aggQ:dNum($('dQ').value),aggV:dNum($('dV').value),date:$('dD').value};$('dGo').disabled=true;$('dGo').textContent='جاري…';
  call('actSave',[PIN,p],function(){ACT.done=true;ACT.open=false;ACT.aggN=p.aggN;ACT.aggQ=p.aggQ;ACT.aggV=p.aggV;ACT.date=p.date;actStats();toast('✔ اتسجّل إن العطاء تم توزيعه')},function(m){toast(m,true);$('dGo').disabled=false;$('dGo').textContent='💾 حفظ'})}
function backToActs(){stopCam();loadActs()}
function loadRecent(){call('recent',[PIN,ACT.code],function(r){$('recent').innerHTML=r.length?r.map(function(x){return '<div><span>ملف '+esc(x.fn)+' — '+esc(x.qty)+'</span><span>'+esc(x.time)+' · '+esc(x.by)+'</span></div>'}).join(''):'<div class="msg">لسه مفيش تسليمات النهارده</div>'})}

/* camera */
function toggleCam(){camOn?stopCam():startCam()}
function startCam(){
  if(!window.Html5Qrcode){toast('الاسكان مش متاح على الجهاز ده — اكتب الرقم',true);return}
  cam=cam||new Html5Qrcode('reader');
  cam.start({facingMode:'environment'},{fps:12,qrbox:function(w,h){var m=Math.floor(Math.min(w,h)*0.7);return{width:m,height:m}}},function(txt){if(busy)return;stopCam();$('q').value=txt;search()},function(){})
    .then(function(){camOn=true;$('camBtn').textContent='⏹ إيقاف الكاميرا'})
    .catch(function(e){toast('مقدرتش أفتح الكاميرا — اسمح للمتصفح بالكاميرا أو اكتب الرقم',true)});
}
function scanPhoto(inp){
  var f=inp.files&&inp.files[0]; if(!f)return;
  if(!window.Html5Qrcode){toast('قراءة الـQR مش متاحة — اكتب الرقم',true);inp.value='';return}
  toast('جاري قراءة الصورة…');
  var h=new Html5Qrcode('reader');
  h.scanFile(f,false).then(function(txt){try{h.clear()}catch(e){}$('q').value=txt;search()})
   .catch(function(){toast('مقدرتش أقرا الـQR — صوّر تاني أقرب وفي نور كويس، أو اكتب الرقم',true)})
   .then(function(){inp.value=''});
}
function stopCam(){if(cam&&camOn){cam.stop().catch(function(){});}camOn=false;$('camBtn')&&($('camBtn').textContent='📷 اسكان الباركود')}

/* search & deliver */
function search(){
  var q=$('q').value.trim(); if(!q||busy)return; busy=true;
  $('result').innerHTML='<div class="card spin">جاري البحث…</div>';
  call('lookup',[PIN,ACT.code,q],function(r){busy=false;current={q:q,r:r};render(r)},function(m){busy=false;$('result').innerHTML='';toast(m,true)});
}
function render(r){
  if(r.notFound){beep(false);$('result').innerHTML='<div class="res no"><div class="v">✖ مش لاقي الأسرة</div><div>راجع الرقم تاني، أو الأسرة مش مسجلة في الجمعية.</div><button class="btn ghost" onclick="clearRes()">رجوع</button></div>';return}
  var c=r.card;
  var kv='<dl class="kv"><dt>الاسم</dt><dd>'+esc(c.name)+'</dd><dt>رقم الملف</dt><dd>'+esc(c.fn)+'</dd><dt>الرقم القومي</dt><dd>…'+esc(c.nid4)+'</dd><dt>المنطقة</dt><dd>'+esc(c.region)+'</dd><dt>الأفراد</dt><dd>'+esc(c.members)+'</dd><dt>التصنيف</dt><dd>'+esc(c.grade||'—')+'</dd></dl>';
  if(!r.ok){beep(false);$('result').innerHTML='<div class="res no"><div class="v">✖ ممنوع التسليم</div><div class="big" style="margin-bottom:10px">'+esc(r.reason)+'</div>'+kv+'<button class="btn ghost" onclick="clearRes()">التالي</button></div>';return}
  beep(true);
  $('result').innerHTML='<div class="res ok"><div class="v">✔ مستحق — '+esc(c.name.split(' ')[0])+'</div>'+kv+
    '<div class="msg" style="text-align:right;margin-top:10px">تأكد إن الاسم مطابق للبطاقة قبل التسليم</div>'+
    '<div class="row" style="margin-top:8px;align-items:center"><label style="flex:0 0 auto">الكمية ('+esc(r.unit||'')+')</label><input id="qty" value="'+esc(r.qty)+'" inputmode="decimal"></div>'+
    '<input id="note" placeholder="ملاحظة (اختياري)" style="margin-top:8px;direction:rtl;text-align:right;font-size:16px">'+
    '<button class="btn" id="okBtn" onclick="confirmDeliver()">✔ تأكيد التسليم</button><button class="btn ghost" onclick="clearRes()">إلغاء</button></div>';
}
function confirmDeliver(){
  if(busy)return; busy=true; $('okBtn').disabled=true; $('okBtn').textContent='جاري التسجيل…';
  call('deliver',[PIN,ACT.code,current.q,$('qty').value,$('note').value],function(d){
    busy=false;beep(true);ACT.today++;ACT.total++;actStats();
    toast('✔ اتسجّل: '+d.name+' — '+d.qty+' '+(d.unit||'')+' — '+d.time);clearRes();loadRecent();
  },function(m){busy=false;beep(false);toast(m,true);search()});
}
function clearRes(){$('result').innerHTML='';$('q').value='';current=null;$('q').focus()}

(function(){var p=load('ansar_pin');if(p)doLogin(p);else show('s-login')})();
</script>
</body>
</html>

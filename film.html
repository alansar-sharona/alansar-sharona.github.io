.ttl{position:absolute;left:0;right:0;text-align:center;font-family:'Reem Kufi';font-weight:700;font-size:96px;color:#fff;text-shadow:0 6px 30px #0006}

.sub.w,.h1.w,.big.w{color:#fff}
.sub:not(.w){color:#fff}
.cap{position:absolute;left:60px;right:60px;background:#fffffff0;border-radius:30px;padding:20px 30px;text-align:center;font-weight:900;font-size:40px;color:#0F4D2C;box-shadow:0 10px 40px #0003;line-height:1.5}
.bubble{position:absolute;background:#fff;border-radius:28px;padding:16px 28px;font-weight:900;font-size:36px;color:#0F4D2C;box-shadow:0 8px 30px #0003;white-space:nowrap}
.bubble:after{content:"";position:absolute;bottom:-22px;left:60px;border:14px solid transparent;border-top:22px solid #fff;border-bottom:0}
.pill{position:absolute;background:#0F4D2C;color:#fff;border-radius:40px;padding:12px 34px;font-weight:900;font-size:38px;box-shadow:0 8px 24px #0003}
.tag{position:absolute;width:120px;text-align:center;background:#0F4D2C;color:#fff;border-radius:22px;padding:4px 0;font-weight:900;font-size:30px}
.stat{position:absolute;background:#ffffffee;border-radius:26px;padding:10px 30px;text-align:center;box-shadow:0 8px 24px #0004}
.stat b{display:block;font-size:64px;font-weight:900;color:#0F4D2C;line-height:1.1}.stat span{font-size:28px;font-weight:700;color:#1B2A21}
.h1{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-size:64px;color:#0F4D2C}
.card{position:absolute;top:240px;width:300px;height:430px;background:#fff;border-radius:30px;box-shadow:0 10px 40px #0f4d2c22;text-align:center;padding:10px}
.card svg{width:280px;height:300px}.card p{font-weight:900;font-size:30px;color:#0F4D2C;line-height:1.35;padding:0 10px}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-size:110px;color:#0F4D2C}
.sub2{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:38px;color:#1B2A21}

.chips{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:24px}
.chips span{background:#ffffff1f;border:2px solid #ffffff55;color:#fff;border-radius:40px;padding:8px 30px;font-weight:900;font-size:34px}
.bar{position:absolute;left:70px;right:70px;height:80px;display:flex;align-items:center;gap:22px}
.bl{width:170px;font-weight:900;font-size:40px;color:#fff;line-height:1}.bl small{display:block;font-size:24px;font-weight:700;color:#ffffffaa;margin-top:6px}
.bt{flex:1;height:46px;background:#ffffff1a;border-radius:23px;overflow:hidden}.bf{height:100%;border-radius:23px}
.bv{width:170px;text-align:left;font-weight:900;font-size:44px;color:#F6EBC8}
